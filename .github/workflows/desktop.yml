name: Desktop regression
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macOS
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Validate CI evidence selection
        run: node --test ../.github/scripts/find-desktop-validation.test.cjs
      - name: Find identical validated source
        id: validation
        if: github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const validate = require('./.github/scripts/find-desktop-validation.cjs');
            await validate({ github, context, core });
      - uses: actions/cache@v4
        if: steps.validation.outputs.reused != 'true'
        with:
          path: artifacts/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages*.lock.json', '.config/dotnet-tools.json', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-dotnet@v4
        if: steps.validation.outputs.reused != 'true'
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        if: steps.validation.outputs.reused != 'true'
        with:
          python-version: '3.x'
      - name: Prepare pinned Mapset Verifier engine
        if: steps.validation.outputs.reused != 'true'
        run: |
          python ../scripts/Test-MapsetVerifierUpdate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../scripts/Build-MapsetVerifier.py
      - run: dotnet build ../FruitsAtelier.sln -c Release -p:RestoreLockedMode=true
        if: steps.validation.outputs.reused != 'true'
      - name: Existing platform-independent and editor regression
        if: steps.validation.outputs.reused != 'true'
        run: |
          foreach ($suite in @('Core', 'Gameplay', 'App', 'Skinning', 'SkinArchive')) {
            dotnet run --no-build --project ../tests/FruitsAtelier.$suite.Tests -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          dotnet run --no-build --project ../tests/FruitsAtelier.Formats.Tests -c Release -- --skip-external-fixtures
      - name: Mapset Verifier regression
        if: steps.validation.outputs.reused != 'true'
        run: |
          dotnet run --no-build --project ../tests/FruitsAtelier.App.Tests -c Release -- --mapset-verifier-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build --project ../tests/FruitsAtelier.App.Tests -c Release -- --mapset-verifier-engine-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $check = Start-Process -FilePath ../src/FruitsAtelier.App/bin/Release/net10.0-windows/FruitsAtelier.App.exe -ArgumentList @('--render-check', '--mapset-verifier-render-check') -WindowStyle Hidden -Wait -PassThru
          exit $check.ExitCode
      - name: Hitsound PCM regression (no audio device)
        if: steps.validation.outputs.reused != 'true'
        run: dotnet run --no-build --project ../tests/FruitsAtelier.Audio.Tests -c Release -- --hitsound-check
      - name: Build and check the distributable Windows package
        if: steps.validation.outputs.reused != 'true'
        run: |
          ../scripts/Publish-Windows.ps1 -Version 0.0.2-alpha.1
          ../scripts/Test-WindowsPackage.ps1 -Archive ../artifacts/releases/FruitsAtelier-0.0.2-alpha.1-win-x64.zip
      - name: Verify portable upgrade and corrupt download rejection
        if: steps.validation.outputs.reused != 'true'
        run: |
          ../scripts/Publish-Windows.ps1 -Version 0.0.2-alpha.2 -OutputDirectory ../artifacts/update-feed
          ../scripts/Test-WindowsUpdate.ps1 -Archive ../artifacts/releases/FruitsAtelier-0.0.2-alpha.1-win-x64.zip -FeedDirectory ../artifacts/update-feed -ExpectedVersion 0.0.2-alpha.2
