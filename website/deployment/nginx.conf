server {
    listen 80;
    listen [::]:80;
    server_name fruitsatelier.himiko.moe;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://fruitsatelier.himiko.moe$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fruitsatelier.himiko.moe;
    root /var/www/fruitsatelier/current;
    index index.html;
    etag off;
    if_modified_since off;
    ssl_certificate /etc/letsencrypt/live/fruitsatelier.himiko.moe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fruitsatelier.himiko.moe/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;
    location ~ ^/(?:zh|en)(?:/index\.html|/)?$ {
        add_header Cache-Control "no-store" always;
        return 302 /?site=fruitsatelier;
    }
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { try_files $uri $uri/ =404; }
    location ~* \.(?:css|js|png|svg)$ {
        expires 1h;
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
}
